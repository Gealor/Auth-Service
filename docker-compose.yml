version: '3.8'
networks:
  dev:

services:
  app:
    build: .
    ports:
      - 8000:8000
    networks:
      - dev

  db:
    image: postgres
    env_file:
      - .env
    ports:
      - 7000:${PGPORT} # замечание: чтобы docker-compose увидел переменную PGPORT, нужно указать ее в файле .env, который должен находиться в той же папке, что и docker-compose.yml
    volumes:
    - auth_bd_data:/var/lib/postgresql/data
    networks:
      - dev

volumes:  # указание глобального тома где-то в папках докера, чтобы не мозолила глаза
  auth_bd_data:

